<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="siteBrowserTitle">অপেক্ষা করুন...</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #1f4068, #162447, #0f4c75, #3282b8);
            background-size: 400% 400%; animation: gradientBG 10s ease infinite;
            min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
            color: #fff; padding: 40px 15px; overflow-x: hidden;
        }
        .center-wrapper { display: flex; flex-direction: column; justify-content: flex-start; align-items: center; gap: 25px; width: 100%; max-width: 500px; }
        
        /* মেইন কন্টেইনার বক্সের গ্লাস অ্যানিমেশন */
        .container { 
            position: relative;
            overflow: hidden;
            text-align: center; 
            padding: 40px 30px 90px 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            animation: slideUp 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards; 
            z-index: 20; 
        }
        .container::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(#00d2ff, #0066ff, transparent, transparent, #00d2ff);
            animation: rotateBorder 4s linear infinite; z-index: 1;
        }
        .container::after {
            content: ''; position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: rgba(17, 30, 61, 0.9); backdrop-filter: blur(15px); border-radius: 22px; z-index: 2;
        }
        #offlineNotice, #normalContent { position: relative; z-index: 3; }
        
        h1 { font-size: 20px; margin-bottom: 12px; font-weight: 600; min-height: 40px; }
        p { font-size: 14px; color: #e0e6ed; margin-bottom: 25px; line-height: 1.6; }
        
        .hero-section { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .logo-container { position: relative; width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; }
        .static-logo { width: 55px; height: 55px; object-fit: contain; z-index: 2; border-radius: 12px; display: none; }
        
        /* স্পিনিং রিং অ্যানিমেশন */
        .loader-ring { position: absolute; width: 80px; height: 80px; border: 4px solid rgba(255, 255, 255, 0.05); border-radius: 50%; border-left-color: #00d2ff; border-right-color: #00d2ff; animation: spin 2s linear infinite; box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); z-index: 1; }
        
        .loading-placeholder {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loadingPulse 1.5s infinite;
            border-radius: 8px;
            display: inline-block;
        }
        .text-placeholder { width: 80%; height: 20px; margin: 10px 0; }
        
        /* ভিজিটর বক্সের বর্ডার অ্যানিমেশন */
        .visitor-stats-wrapper {
            position: relative;
            border-radius: 12px;
            padding: 2px;
            overflow: hidden;
            min-width: 175px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .visitor-stats-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(#00d2ff, #0066ff, transparent, transparent, #00d2ff);
            animation: rotateBorder 4s linear infinite;
        }
        .visitor-stats { 
            position: relative;
            background: #111e3d;
            border-radius: 10px; 
            padding: 10px 15px; 
            text-align: left; 
            z-index: 2;
        }

        .stats-title { font-size: 11px; color: #a8c7fa; margin-bottom: 8px; font-weight: bold; border-bottom: 1px dashed rgba(255, 255, 255, 0.2); padding-bottom: 5px; text-align: center; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #e0e6ed; margin-bottom: 5px; gap: 15px; }
        .stat-number { color: #00d2ff; font-weight: bold; font-family: 'Courier New', Courier, monospace; font-size: 14px; text-shadow: 0 0 5px rgba(0, 210, 255, 0.4); }
        
        /* বাটন CSS - 2026 Updated Layout */
        .btn { 
            display: none; 
            padding: 14px 30px; 
            background: linear-gradient(90deg, #00d2ff 0%, #0066ff 100%); 
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold; 
            font-size: 15px; 
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.4); 
            white-space: nowrap; 
            position: relative; 
            margin: 15px auto 25px auto; 
            z-index: 10; 
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }
        .btn:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: 0 12px 30px rgba(0, 102, 255, 0.6); 
        }
        
        /* ভিডিও বক্সের গ্লাস অ্যানিমেশন */
        .video-wrapper { 
            width: 100%; margin-top: 20px; display: none; border-radius: 14px; overflow: hidden; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); position: relative; 
        }
        .video-wrapper::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(#00d2ff, #0066ff, transparent, transparent, #00d2ff);
            animation: rotateBorder 4s linear infinite; z-index: 1;
        }
        .video-wrapper::after {
            content: ''; position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: #000; border-radius: 12px; z-index: 2;
        }
        
        video { width: 100%; display: block; position: relative; z-index: 3; border-radius: 12px; transition: all 0.3s ease; }

        /* মিডিয়া শোকেস বক্স */
        .media-box-wrapper {
            width: 100%; margin-top: 20px; display: none; border-radius: 14px; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); position: relative;
        }
        .media-box-wrapper::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(#00d2ff, #0066ff, transparent, transparent, #00d2ff);
            animation: rotateBorder 4s linear infinite; z-index: 1;
        }
        .media-box-wrapper::after {
            content: ''; position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: #111e3d; border-radius: 12px; z-index: 2;
        }
        .media-box-content { position: relative; z-index: 3; width: 100%; display: block; }
        
        .media-box-content img { width: 100%; display: none; border-radius: 12px; transition: all 0.3s ease; }
        .media-box-content video { width: 100%; display: none; object-fit: contain; border-radius: 12px; background: #000; transition: all 0.3s ease; }
        .media-box-content iframe { width: 100%; display: none; aspect-ratio: 16/9; border: none; border-radius: 12px; background: #000; }

        /* অফলাইন নোটিশ বক্সের গ্লাস অ্যানিমেশন */
        .no-internet-box { 
            display: none; position: relative; overflow: hidden; padding: 15px; border-radius: 15px; 
            margin-bottom: 20px; color: #ff9f93; animation: fadeIn 0.5s ease-in-out; 
        }
        .no-internet-box::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(#e74c3c, #ff9f93, transparent, transparent, #e74c3c);
            animation: rotateBorder 4s linear infinite; z-index: 1;
        }
        .no-internet-box::after {
            content: ''; position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: rgba(30, 15, 15, 0.95); backdrop-filter: blur(15px); border-radius: 13px; z-index: 2;
        }
        .no-internet-box h3 { font-size: 16px; margin-bottom: 8px; color: #fff; position: relative; z-index: 3; }
        
        @keyframes rotateBorder { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes loadingPulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { 0% { opacity: 0; transform: translateY(-20px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="center-wrapper">
        <div class="container">
            <div id="offlineNotice" class="no-internet-box">
                <h3>⚠️আপনার ইন্টারনেট বন্ধ⚠️</h3>
                <p style="margin-bottom: 0; color: #fff; position: relative; z-index: 3;">দয়া করে ইন্টারনেট চালু করুন。</p>
            </div>
            
            <div id="normalContent">
                <div class="hero-section">
                    <div class="visitor-stats-wrapper">
                        <div class="visitor-stats">
                            <div class="stats-title">👁️ এই সাইটটিতে ভিজিট করেছেন</div>
                            <div class="stat-row"><span>আজকে:</span><span class="stat-number" id="vis-today">...</span></div>
                            <div class="stat-row"><span>এই মাসে:</span><span class="stat-number" id="vis-month">...</span></div>
                            <div class="stat-row"><span>সর্বমোট:</span><span class="stat-number" id="vis-total">...</span></div>
                        </div>
                    </div>
                    <div class="logo-container">
                        <div class="loader-ring" id="mainLogoLoader"></div>
                        <img id="dynamicLogo" src="" alt="Logo" class="static-logo">
                    </div>
                </div>
                
                <h1 id="dynamicHeading">
                    <span class="loading-placeholder text-placeholder"></span>
                    <span class="loading-placeholder text-placeholder" style="width: 60%;"></span>
                </h1>
                
                <p id="subText" style="display:none;">পুরাতন একাউন্ট লগ ইন দিন<br>অ্যাকাউন্ট না থাকলে অ্যাকাউন্ট নতুন ভাবে তৈরি করুন</p>
                
                <a href="#" id="redirectBtn" class="btn">সরাসরি প্রবেশ করুন</a>
                
                <div id="videoContainer" class="video-wrapper">
                    <video id="myVideoPlayer" controls preload="auto" playsinline></video>
                </div>

                <div id="mediaBoxContainer" class="media-box-wrapper">
                    <div class="media-box-content">
                        <img id="mediaImage" src="" alt="Dynamic Photo">
                        <video id="mediaVideo" controls preload="auto" playsinline></video>
                        <iframe id="mediaYoutube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                </div>
                <br>
            </div>
        </div>
    </div>

    <script>
        let redirectTimeout;
        window.dynamicTargetUrl = ""; 

        function startRedirectTimer() { 
            clearTimeout(redirectTimeout);
            if(!window.dynamicTargetUrl) return; 
            redirectTimeout = setTimeout(function() { 
                if (navigator.onLine && window.dynamicTargetUrl) {
                    window.location.href = window.dynamicTargetUrl; 
                }
            }, 10000); 
        }

        function checkInternet() {
            const offlineNotice = document.getElementById('offlineNotice');
            const normalContent = document.getElementById('normalContent');
            if (!navigator.onLine) {
                clearTimeout(redirectTimeout); offlineNotice.style.display = 'block'; normalContent.style.display = 'none';
            } else {
                offlineNotice.style.display = 'none'; normalContent.style.display = 'block'; startRedirectTimer();
            }
        }
        window.onload = function() { checkInternet(); };
        window.addEventListener('online', checkInternet); window.addEventListener('offline', checkInternet);
        
        const handleVideoScale = function() {
            const width = this.videoWidth;
            const height = this.videoHeight;
            
            if (height > width) {
                this.style.width = 'auto';
                this.style.height = 'auto';
                this.style.maxHeight = '350px'; 
                this.style.margin = '0 auto'; 
                this.style.display = 'block';
                this.style.aspectRatio = 'auto';
            } else {
                this.style.width = '100%';
                this.style.height = 'auto';
                this.style.maxHeight = 'none';
                this.style.aspectRatio = '16/9';
            }
        };

        document.getElementById('myVideoPlayer').onloadedmetadata = handleVideoScale;
        document.getElementById('mediaVideo').onloadedmetadata = handleVideoScale;
        
    </script>
    
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
      import { getDatabase, ref, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

      const firebaseConfig = {
        apiKey: "AIzaSyB-rvwlsYHk5T-6Z0qsXfk2Mk1Xtxh4fXE",
        authDomain: "imovisitors.firebaseapp.com",
        databaseURL: "https://imovisitors-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "imovisitors",
        storageBucket: "imovisitors.firebasestorage.app",
        messagingSenderId: "159209243974",
        appId: "1:159209243974:web:8b1c143d27c5e638f75147",
        measurementId: "G-6VRYVK38KE"
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const db = getDatabase(app);

      const urlParams = new URLSearchParams(window.location.search);
      let pageId = urlParams.get('id');
      
      if (!pageId || pageId.trim() === '') { 
          pageId = '1'; 
      }

      const pageRef = ref(db, 'dynamic_pages/' + pageId);

      const dateObj = new Date();
      const todayDate = dateObj.toISOString().split('T')[0]; 
      const currentMonth = todayDate.substring(0, 7); 

      if (navigator.onLine) {
        runTransaction(pageRef, (currentData) => {
          if (currentData === null) {
            let initialData = {
              site_name: "",
              logo_url: "",
              redirect_url: "",
              video_url: "", 
              extra_media_url: "", 
              total: 1,
              months: {},
              days: {}
            };
            initialData.months[currentMonth] = 1;
            initialData.days[todayDate] = 1;
            return initialData;
          } else {
            currentData.total = (currentData.total || 0) + 1;
            if (!currentData.months) currentData.months = {};
            if (!currentData.days) currentData.days = {};
            
            currentData.months[currentMonth] = (currentData.months[currentMonth] || 0) + 1;
            currentData.days[todayDate] = (currentData.days[todayDate] || 0) + 1;
            return currentData;
          }
        });
      }

      onValue(pageRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            if (data.site_name) {
                document.getElementById('siteBrowserTitle').innerText = data.site_name;
                document.getElementById('dynamicHeading').innerHTML = `<br>${data.site_name}<br>প্রবেশ করা হচ্ছে<br>10 সেকেন্ড অপেক্ষা করুন।`;
                document.getElementById('subText').style.display = 'block';
            }

            if(data.logo_url && data.logo_url.trim() !== "") { 
                const logoImg = document.getElementById('dynamicLogo');
                logoImg.src = data.logo_url; 
                logoImg.style.display = 'block';
            }
            
            document.getElementById('vis-today').innerText = (data.days && data.days[todayDate]) ? data.days[todayDate] : 1;
            document.getElementById('vis-month').innerText = (data.months && data.months[currentMonth]) ? data.months[currentMonth] : 1;
            document.getElementById('vis-total').innerText = data.total || 1;
            
            if (data.redirect_url && data.redirect_url.trim() !== "") {
                window.dynamicTargetUrl = data.redirect_url;
                const rBtn = document.getElementById('redirectBtn');
                rBtn.href = window.dynamicTargetUrl;
                rBtn.style.display = 'inline-block';
                startRedirectTimer();
            }

            if (data.video_url && data.video_url.trim() !== "") {
                const videoContainer = document.getElementById('videoContainer');
                const videoPlayer = document.getElementById('myVideoPlayer');
                videoContainer.style.display = 'block';

                if (data.video_url.includes('.m3u8')) {
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(data.video_url);
                        hls.attachMedia(videoPlayer);
                    } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                        videoPlayer.src = data.video_url;
                    }
                } else {
                    videoPlayer.src = data.video_url;
                }
            }

            if (data.extra_media_url && data.extra_media_url.trim() !== "") {
                const mediaBoxContainer = document.getElementById('mediaBoxContainer');
                const mediaImage = document.getElementById('mediaImage');
                const mediaVideo = document.getElementById('mediaVideo');
                const mediaYoutube = document.getElementById('mediaYoutube');
                
                mediaBoxContainer.style.display = 'block';
                
                mediaImage.style.display = 'none';
                mediaVideo.style.display = 'none';
                mediaYoutube.style.display = 'none';
                
                const rawUrl = data.extra_media_url.trim();
                const lowerUrl = rawUrl.toLowerCase();
                
                if (lowerUrl.includes('facebook.com') || lowerUrl.includes('fb.watch')) {
                    mediaYoutube.style.display = 'block';
                    mediaYoutube.src = 'https://www.facebook.com/plugins/video.php?href=' + encodeURIComponent(rawUrl) + '&show_text=false';
                }
                else if (lowerUrl.includes('youtube.com') || lowerUrl.includes('youtu.be')) {
                    mediaYoutube.style.display = 'block';
                    const ytRegex = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/|.*[?&]v=))([\w-]{11})/i;
                    const match = rawUrl.match(ytRegex);
                    
                    if (match && match[1]) {
                        mediaYoutube.src = 'https://www.youtube.com/embed/' + match[1];
                    }
                } 
                else if (lowerUrl.includes('.mp4') || lowerUrl.includes('.m3u8') || lowerUrl.includes('.webm') || lowerUrl.includes('.ogg')) {
                    mediaVideo.style.display = 'block';
                    if (lowerUrl.includes('.m3u8')) {
                        if (Hls.isSupported()) {
                            const mediaHls = new Hls();
                            mediaHls.loadSource(rawUrl);
                            mediaHls.attachMedia(mediaVideo);
                        } else if (mediaVideo.canPlayType('application/vnd.apple.mpegurl')) {
                            mediaVideo.src = rawUrl;
                        }
                    } else {
                        mediaVideo.src = rawUrl;
                    }
                } 
                else {
                    mediaImage.style.display = 'block';
                    mediaImage.src = rawUrl;

                    mediaImage.onload = function() {
                        const width = this.naturalWidth;
                        const height = this.naturalHeight;
                        
                        if (height > width) {
                            this.style.width = 'auto';
                            this.style.height = 'auto';
                            this.style.maxHeight = '350px'; 
                            this.style.margin = '0 auto'; 
                            this.style.display = 'block';
                        } 
                        else {
                            this.style.width = '100%';
                            this.style.height = 'auto';
                            this.style.maxHeight = 'none';
                        }
                    };
                }
            } else {
                document.getElementById('mediaBoxContainer').style.display = 'none';
            }
        }
      });
    </script>
</body>
</html>
